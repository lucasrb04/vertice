# Pipeline do Vértice (spec de deploy §5.1). PR: verify + dependencies + image (sem publicar).
# Push em main: verify + dependencies + publish (GHCR) + deploy na VM da OCI.
# Repositório público com PR de fork: só `pull_request` (nunca `pull_request_target`) e permissões mínimas.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      # Mesmo banco e porta do `postgres-test` do Compose, para o .env.test funcionar sem mudança.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vertice
          POSTGRES_PASSWORD: vertice
          POSTGRES_DB: vertice_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U vertice -d vertice_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm tsc --noEmit
      - run: pnpm test:coverage

  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high

  # PR: build e Trivy, sem publicar e sem permissão de escrita no registro.
  image:
    if: github.event_name == 'pull_request'
    needs: [verify, dependencies]
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        target: [app, migrate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/arm64
          load: true
          tags: vertice-${{ matrix.target }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vertice-${{ matrix.target }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # main: o mesmo build e Trivy; só com o Trivy verde a imagem vai para o GHCR.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, dependencies]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [app, migrate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/arm64
          load: true
          tags: ghcr.io/lucasrb04/vertice-${{ matrix.target }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/lucasrb04/vertice-${{ matrix.target }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker push "ghcr.io/lucasrb04/vertice-${{ matrix.target }}:${GITHUB_SHA}"

  # SSH com chave presa ao deploy.sh na VM: envia só a tag e, no stdin, o .env montado dos secrets.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-24.04
    environment: production
    # Um deploy por vez; o seguinte espera, nunca cancela no meio de uma migration.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy na VM
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          VISITOR_HASH_SECRET: ${{ secrets.VISITOR_HASH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          INITIAL_ADMIN_EMAIL: ${{ vars.INITIAL_ADMIN_EMAIL }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          {
            printf '%s\n' "NODE_ENV=production" "ENABLE_TEST_AUTH=false" "DEFAULT_INSTITUTION_SLUG=unifei-itajuba"
            printf '%s\n' "APP_DOMAIN=verticehub.online" "BETTER_AUTH_URL=https://verticehub.online"
            printf '%s\n' "POSTGRES_USER=vertice" "POSTGRES_DB=vertice" "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            printf '%s\n' "DATABASE_URL=postgresql://vertice:$POSTGRES_PASSWORD@postgres:5432/vertice"
            printf '%s\n' "BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET" "VISITOR_HASH_SECRET=$VISITOR_HASH_SECRET"
            printf '%s\n' "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID" "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET"
            printf '%s\n' "NEXT_PUBLIC_APP_URL=$NEXT_PUBLIC_APP_URL"
            printf '%s\n' "NEXT_PUBLIC_TURNSTILE_SITE_KEY=$NEXT_PUBLIC_TURNSTILE_SITE_KEY" "TURNSTILE_SECRET_KEY=$TURNSTILE_SECRET_KEY"
            printf '%s\n' "RESEND_API_KEY=$RESEND_API_KEY" "EMAIL_FROM=$EMAIL_FROM" "INITIAL_ADMIN_EMAIL=$INITIAL_ADMIN_EMAIL"
          } > "$RUNNER_TEMP/vertice.env"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "deploy@$DEPLOY_HOST" "$GITHUB_SHA" < "$RUNNER_TEMP/vertice.env"
      - name: Apaga chave e .env do runner
        if: always()
        run: rm -f "$RUNNER_TEMP/vertice.env" ~/.ssh/deploy_key
