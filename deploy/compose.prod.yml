# Produção na VM da OCI (spec de deploy §5.4). Sempre chamado pelo deploy.sh com
# `-p vertice --env-file /opt/vertice/.env` e IMAGE_TAG no ambiente.
# Só o Caddy publica portas na internet; o Dozzle escuta só no loopback (acesso por túnel SSH).

# Logs no journald da VM: sobrevivem à troca de container a cada deploy e aos reboots, com rotação
# e retenção de 14 dias definidas em /etc/systemd/journald.conf.d/ (docs/DEPLOY.md §6).
x-logging: &logging
  driver: journald
  options:
    tag: "{{.Name}}"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: ghcr.io/lucasrb04/vertice-app:${IMAGE_TAG}
    restart: unless-stopped
    logging: *logging
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  # Migrations, seed e rebuild da busca. Não sobe com o resto: só via `run --rm migrate <script>`.
  migrate:
    image: ghcr.io/lucasrb04/vertice-migrate:${IMAGE_TAG}
    profiles: ["manual"]
    logging: *logging
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  # Painel de logs. Só lê: socket do Docker read-only, sem ações nem shell (desligados por padrão).
  # Acesso: `ssh -N vertice-logs` e http://localhost:8080 (docs/DEPLOY.md §6).
  dozzle:
    image: amir20/dozzle:v11.3.5
    restart: unless-stopped
    logging: *logging
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_FILTER: label=com.docker.compose.project=vertice
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  pgdata:
  caddy_data:
  caddy_config:
